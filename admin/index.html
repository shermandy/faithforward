<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Management System</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <!-- Decap CMS Script -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // 1. Inject live CSS stylesheet
      CMS.registerPreviewStyle("/css/style.css");

      // Helper function to safely parse Markdown into HTML
      function parseMd(text) {
        if (!text) return { __html: "" };
        return { __html: window.marked.parse(String(text)) };
      }

      // 2. Custom Event Preview Component
      var EventPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var title = entry.getIn(["data", "title"]);
          var date = entry.getIn(["data", "event_date"]);
          var endDate = entry.getIn(["data", "event_end_date"]);
          var location = entry.getIn(["data", "location"]);
          var summary = entry.getIn(["data", "summary"]);
          var body = this.props.widgetFor("body");

          return h(
            "article",
            { className: "event-detail" },
            h(
              "header",
              { className: "event-header" },
              h("h1", {}, title),
              h(
                "div",
                { className: "event-meta" },
                date
                  ? h(
                      "p",
                      {},
                      h("strong", {}, "Date & Time: "),
                      date + (endDate ? " – " + endDate : ""),
                    )
                  : null,
                location
                  ? h("p", {}, h("strong", {}, "Location: "), location)
                  : null,
              ),
            ),
            summary
              ? h("p", { className: "event-summary" }, h("strong", {}, summary))
              : null,
            h("hr", {}),
            h("div", { className: "event-content" }, body),
          );
        },
      });

      CMS.registerPreviewTemplate("events", EventPreview);

      // 3. Custom Modular Pages Preview Component
      var PagePreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var blocks = entry.getIn(["data", "blocks"]);
          var self = this;

          if (!blocks) {
            return h(
              "main",
              {},
              h("p", { style: { padding: "20px" } }, "No sections added yet."),
            );
          }

          return h(
            "main",
            {},
            blocks.map(function (block, index) {
              var type = block.get("type");

              // HERO BANNER
              if (type === "hero_banner") {
                var bgImage = block.get("bg_image");
                var bgUrl = bgImage
                  ? self.props.getAsset(bgImage).toString()
                  : "";
                var links = block.get("links");

                return h(
                  "section",
                  {
                    key: index,
                    className: "hero",
                    style: {
                      backgroundImage: bgUrl ? "url('" + bgUrl + "')" : "none",
                      backgroundSize: "cover",
                      backgroundPosition: "center",
                    },
                  },
                  h(
                    "div",
                    { className: "hero-text" },
                    block.get("heading")
                      ? h("h2", {}, block.get("heading"))
                      : null,
                    block.get("content")
                      ? h("div", {
                          dangerouslySetInnerHTML: parseMd(
                            block.get("content"),
                          ),
                        })
                      : null,
                    links
                      ? h(
                          "div",
                          { className: "hero-buttons" },
                          links.map(function (link, lIdx) {
                            return h(
                              "a",
                              {
                                key: lIdx,
                                href: link.get("url") || "#",
                                className:
                                  "button " +
                                  (link.get("button_color") || "primary"),
                                target: link.get("target") || "_self",
                              },
                              link.get("text"),
                            );
                          }),
                        )
                      : null,
                  ),
                );
              }
              // IMAGE & CONTENT BOX (inside PagePreview)
              if (type === "media_box") {
                var img = block.get("image");
                var imgUrl = img ? self.props.getAsset(img).toString() : "";
                var position = block.get("image_position") || "left";
                var bgColor = block.get("background_color") || "white";
                var btnStyle = block.get("button_style") || "primary"; // <--- Add this line

                var colors = {
                  white: { bg: "#ffffff", border: "#e5e7eb", text: "#1a1a1a" },
                  "light-grey": {
                    bg: "#f8fafc",
                    border: "#cbd5e1",
                    text: "#1a1a1a",
                  },
                  amber: { bg: "#d59874", text: "#000000" },
                  "dark-green": {
                    bg: "#2d4a33",
                    text: "#f4dcae",
                  },
                };
                var currentTheme = colors[bgColor] || colors.white;

                var btnText = block.get("button_text");
                var btnUrl = block.get("button_url");
                var buttonHtml =
                  btnUrl && btnText
                    ? '<p><a href="' +
                      btnUrl +
                      '" class="button ' +
                      btnStyle +
                      '">' +
                      btnText +
                      "</a></p>" // <--- Uses dynamic btnStyle here
                    : "";

                return h(
                  "section",
                  {
                    key: index,
                    className:
                      "media-box media-box--" +
                      position +
                      " media-box--bg-" +
                      bgColor,
                    style: {
                      display: "flex",
                      gap: "2rem",
                      alignItems: "center",
                      margin: "3rem 0",
                      padding: "2.5rem",
                      borderRadius: "12px",
                      backgroundColor: currentTheme.bg,
                      border: "1px solid " + currentTheme.border,
                      color: currentTheme.text,
                      flexDirection:
                        position === "right" ? "row-reverse" : "row",
                    },
                  },
                  h(
                    "div",
                    { className: "media-box__image", style: { flex: 1 } },
                    imgUrl
                      ? h("img", {
                          src: imgUrl,
                          alt:
                            block.get("image_alt") ||
                            block.get("heading") ||
                            "",
                          style: { width: "100%", borderRadius: "8px" },
                        })
                      : null,
                  ),
                  h(
                    "div",
                    { className: "media-box__content", style: { flex: 1 } },
                    block.get("heading")
                      ? h(
                          "h3",
                          { style: { color: currentTheme.text, marginTop: 0 } },
                          block.get("heading"),
                        )
                      : null,
                    h("div", {
                      dangerouslySetInnerHTML: parseMd(block.get("content")),
                    }),
                    buttonHtml
                      ? h("div", {
                          dangerouslySetInnerHTML: { __html: buttonHtml },
                        })
                      : null,
                  ),
                );
              }
              // RICH TEXT SECTION
              if (type === "rich_text") {
                var textAlign = block.get("text_align") || "left";
                var bgColor = block.get("bg_color") || "white";
                var bgClass = bgColor !== "white" ? " bg-" + bgColor : "";

                return h(
                  "section",
                  {
                    key: index,
                    className: "rich-text" + bgClass + " text-" + textAlign,
                  },
                  h("div", {
                    className: "container",
                    dangerouslySetInnerHTML: parseMd(block.get("body")),
                  }),
                );
              }

              // MULTI-TEXT GRID
              if (type === "multi_text_grid") {
                var bgColor = block.get("bg_color") || "white";
                var bgClass = bgColor !== "white" ? " bg-" + bgColor : "";
                var sections = block.get("text_sections");

                return h(
                  "section",
                  { key: index, className: "multi-text-grid" + bgClass },
                  h(
                    "div",
                    { className: "container" },
                    block.get("section_heading")
                      ? h(
                          "h2",
                          { className: "section-title" },
                          block.get("section_heading"),
                        )
                      : null,
                    sections
                      ? h(
                          "div",
                          { className: "grid-3-col" },
                          sections.map(function (sec, sIdx) {
                            return h(
                              "div",
                              { key: sIdx, className: "grid-card" },
                              sec.get("heading")
                                ? h("h3", {}, sec.get("heading"))
                                : null,
                              h("div", {
                                className: "card-body",
                                dangerouslySetInnerHTML: parseMd(
                                  sec.get("body"),
                                ),
                              }),
                            );
                          }),
                        )
                      : null,
                  ),
                );
              }

              // IMAGE CARD GRID
              if (type === "image_card_grid") {
                var cards = block.get("cards");

                return h(
                  "section",
                  { key: index, className: "image-card-grid" },
                  block.get("section_heading")
                    ? h(
                        "h2",
                        { className: "section-title" },
                        block.get("section_heading"),
                      )
                    : null,
                  cards
                    ? h(
                        "div",
                        { className: "image-card-container" },
                        cards.map(function (card, cIdx) {
                          var img = card.get("image");
                          var imgUrl = img
                            ? self.props.getAsset(img).toString()
                            : "";

                          return h(
                            "div",
                            { key: cIdx, className: "card" },
                            h(
                              "a",
                              {
                                href: card.get("card_url") || "#",
                                className: "card-link-wrapper",
                              },
                              card.get("heading")
                                ? h("h3", {}, card.get("heading"))
                                : null,
                              imgUrl
                                ? h("img", {
                                    src: imgUrl,
                                    alt: card.get("image_alt") || "",
                                  })
                                : null,
                              card.get("body")
                                ? h("div", {
                                    className: "card-body",
                                    dangerouslySetInnerHTML: parseMd(
                                      card.get("body"),
                                    ),
                                  })
                                : null,
                              card.get("cta_text")
                                ? h(
                                    "span",
                                    { className: "card-cta button primary" },
                                    card.get("cta_text"),
                                  )
                                : null,
                            ),
                          );
                        }),
                      )
                    : null,
                );
              }

              // THREE CARD SECTION
              if (type === "three_cards") {
                var cards = block.get("cards");

                return h(
                  "section",
                  { key: index, className: "three-card-section" },
                  h(
                    "div",
                    { className: "container" },
                    block.get("heading")
                      ? h("h2", {}, block.get("heading"))
                      : null,
                    cards
                      ? h(
                          "div",
                          { className: "grid-3-col" },
                          cards.map(function (card, cIdx) {
                            return h(
                              "div",
                              { key: cIdx, className: "grid-card" },
                              card.get("title")
                                ? h("h3", {}, card.get("title"))
                                : null,
                              card.get("content")
                                ? h("div", {
                                    className: "card-body",
                                    dangerouslySetInnerHTML: parseMd(
                                      card.get("content"),
                                    ),
                                  })
                                : null,
                              card.get("link")
                                ? h(
                                    "a",
                                    {
                                      href: card.get("link"),
                                      className: "button primary",
                                    },
                                    "Learn More",
                                  )
                                : null,
                            );
                          }),
                        )
                      : null,
                  ),
                );
              }

              return h(
                "div",
                {
                  key: index,
                  style: { padding: "10px", border: "1px dashed #ccc" },
                },
                "Block type: " + type,
              );
            }),
          );
        },
      });

      // Register preview template for file-based page entries
      CMS.registerPreviewTemplate("home", PagePreview);
      CMS.registerPreviewTemplate("about", PagePreview);
      CMS.registerPreviewTemplate("media", PagePreview);
      CMS.registerPreviewTemplate("services", PagePreview);
      CMS.registerPreviewTemplate("donate", PagePreview);
      CMS.registerPreviewTemplate("volunteer", PagePreview);

      CMS.registerEditorComponent({
        id: "button",
        label: "Button Link",
        fields: [
          { name: "text", label: "Button Text", widget: "string" },
          { name: "url", label: "Button URL", widget: "string" },
          {
            name: "style",
            label: "Button Style",
            widget: "select",
            options: [
              { label: "Primary", value: "primary" },
              { label: "Secondary", value: "secondary" },
            ],
            default: "primary",
          },
        ],
        toBlock: function (obj) {
          var url = obj.url || "#";
          var isExternal = /^https?:\/\//i.test(url);
          var targetAttr = isExternal
            ? ' target="_blank" rel="noopener noreferrer"'
            : "";

          return `<a href="${url}" class="button ${obj.style || "primary"}"${targetAttr}>${obj.text || "Click Here"}</a>`;
        },
        fromBlock: function (match) {
          return {
            url: match[1],
            style: match[2],
            text: match[3],
          };
        },
        pattern:
          /^<a href="(.*?)" class="button (primary|secondary)"(?: target="_blank" rel="noopener noreferrer")?>(.*?)<\/a>$/,
        toPreview: function (obj) {
          var url = obj.url || "#";
          var isExternal = /^https?:\/\//i.test(url);
          var targetAttr = isExternal
            ? ' target="_blank" rel="noopener noreferrer"'
            : "";

          return `<a href="${url}" class="button ${obj.style || "primary"}"${targetAttr}>${obj.text || "Click Here"}</a>`;
        },
      });
      // add alert box to rich text component
      CMS.registerEditorComponent({
        id: "alert",
        label: "Alert Box",
        fields: [
          {
            name: "content",
            label: "Alert Message",
            widget: "markdown",
            buttons: ["bold", "italic", "link"], // Optional: limits toolbar to basic formatting
            minimal: true,
          },
        ],
        toBlock: function (obj) {
          return `<div class="alert-box">\n\n${obj.content || ""}\n\n</div>`;
        },
        fromBlock: function (match) {
          return {
            content: match[1].trim(),
          };
        },
        pattern: /^<div class="alert-box">\s*([\s\S]*?)\s*<\/div>$/,
        toPreview: function (obj) {
          return `<div class="alert-box">${obj.content || ""}</div>`;
        },
      });
      CMS.registerEditorComponent({
        id: "mediaBox",
        label: "Image & Content Box",
        fields: [
          {
            name: "image",
            label: "Image",
            widget: "image",
          },
          {
            name: "imageAlt",
            label: "Image Alt Text",
            widget: "string",
            required: false,
          },
          {
            name: "imagePosition",
            label: "Image Position",
            widget: "select",
            options: [
              { label: "Left", value: "left" },
              { label: "Right", value: "right" },
            ],
            default: "left",
          },
          {
            name: "backgroundColor",
            label: "Background Color",
            widget: "select",
            options: [
              { label: "White", value: "white" },
              { label: "Light Grey", value: "light-grey" },
              { label: "Amber", value: "amber" },
              { label: "Dark Green", value: "dark-green" },
            ],
            default: "white",
          },
          {
            name: "heading",
            label: "Heading",
            widget: "string",
          },
          {
            name: "content",
            label: "Content",
            widget: "markdown",
          },
          {
            name: "buttonText",
            label: "Button Text (Optional)",
            widget: "string",
            required: false,
          },
          {
            name: "buttonUrl",
            label: "Button URL (Optional)",
            widget: "string",
            required: false,
          },
          {
            name: "buttonStyle",
            label: "Button Style",
            widget: "select",
            options: [
              { label: "Primary", value: "primary" },
              { label: "Secondary", value: "secondary" },
              { label: "Tertiary", value: "tertiary" },
            ],
            default: "primary",
            required: false,
          },
        ],
        toBlock: function (obj) {
          const position = obj.imagePosition || "left";
          const bgColor = obj.backgroundColor || "white";
          const btnStyle = obj.buttonStyle || "primary";
          const altText = obj.imageAlt || obj.heading || "";

          const buttonHtml =
            obj.buttonUrl && obj.buttonText
              ? `<p><a href="${obj.buttonUrl}" class="button ${btnStyle}">${obj.buttonText}</a></p>`
              : "";

          return `<div class="media-box media-box--${position} media-box--bg-${bgColor}">
  <div class="media-box__image">
    <img src="${obj.image || ""}" alt="${altText}">
  </div>
  <div class="media-box__content">
    <h3>${obj.heading || ""}</h3>
    <div>${obj.content || ""}</div>
    ${buttonHtml}
  </div>
</div>`;
        },
        fromBlock: function (match) {
          return {
            imagePosition: match[1],
            backgroundColor: match[2],
            image: match[3],
            imageAlt: match[4] || "",
            heading: match[5],
            content: match[6].trim(),
            buttonUrl: match[7] || "",
            buttonStyle: match[8] || "primary",
            buttonText: match[9] || "",
          };
        },
        pattern:
          /^<div class="media-box media-box--(left|right) media-box--bg-(white|light-grey|amber|dark-green)">\s*<div class="media-box__image">\s*<img src="(.*?)" alt="(.*?)">\s*<\/div>\s*<div class="media-box__content">\s*<h3>(.*?)<\/h3>\s*<div>([\s\S]*?)<\/div>(?:\s*<p><a href="(.*?)" class="button (primary|secondary|tertiary)">(.*?)<\/a><\/p>)?\s*<\/div>\s*<\/div>$/,
        toPreview: function (obj) {
          const position = obj.imagePosition || "left";
          const bgColor = obj.backgroundColor || "white";
          const btnStyle = obj.buttonStyle || "primary";
          const altText = obj.imageAlt || obj.heading || "";

          const buttonHtml =
            obj.buttonUrl && obj.buttonText
              ? `<p><a href="${obj.buttonUrl}" class="button ${btnStyle}">${obj.buttonText}</a></p>`
              : "";

          const colors = {
            white: { bg: "#ffffff", border: "#e5e7eb", text: "#1a1a1a" },
            "light-grey": { bg: "#f8fafc", border: "#cbd5e1", text: "#1a1a1a" },
            amber: { bg: "#d59874", text: "#000000" },
            "dark-green": { bg: "#2d4a33", text: "#f4dcae" },
          };
          const currentTheme = colors[bgColor] || colors.white;

          return `<div class="media-box media-box--${position}" style="display: flex; gap: 2rem; align-items: center; margin: 2rem 0; padding: 2.5rem; border-radius: 12px; background-color: ${currentTheme.bg}; border: 1px solid ${currentTheme.border}; color: ${currentTheme.text}; flex-direction: ${position === "right" ? "row-reverse" : "row"};">
  <div class="media-box__image" style="flex: 1;">
    <img src="${obj.image || ""}" alt="${altText}" style="width: 100%; border-radius: 8px;">
  </div>
  <div class="media-box__content" style="flex: 1;">
    <h3 style="color: ${currentTheme.text}; margin-top: 0;">${obj.heading || ""}</h3>
    <div>${obj.content || ""}</div>
    ${buttonHtml}
  </div>
</div>`;
        },
      });
    </script>
  </body>
</html>
