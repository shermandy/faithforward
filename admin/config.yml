backend:
  name: git-gateway
  site_domain: faithforwardpa.netlify.app

# Link to your live site displayed in the admin header
display_url: https://faithforwardpa.com

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home"
        name: "home"
        file: "content/index.md"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Layout"
            name: "layout"
            widget: "hidden"
            default: "layout.njk"
          # Define the reusable blocks list anchor
          - &blocks_field
            label: "Page Sections"
            name: "blocks"
            widget: "list"
            typeKey: "type"
            types:
              - label: "Three Card Section"
                name: "three_cards"
                widget: "object"
                fields:
                  - label: "Section Heading"
                    name: "heading"
                    widget: "string"
                    required: false
                  - label: "Cards"
                    name: "cards"
                    widget: "list"
                    min: 3
                    max: 3
                    fields:
                      - label: "Card Title"
                        name: "title"
                        widget: "string"
                      - label: "Card Body"
                        name: "content"
                        widget: "text"
                      - label: "Link URL"
                        name: "link"
                        widget: "string"
                        required: false

              - label: "Hero Banner"
                name: "hero_banner"
                widget: "object"
                fields:
                  - label: "Background Image"
                    name: "bg_image"
                    widget: "image"
                    required: false
                    choose_url: true
                  - label: "Heading Text"
                    name: "heading"
                    widget: "string"
                  - label: "Content"
                    name: "content"
                    widget: "markdown"
                    modes: ["rich_text"]
                    buttons:
                      [
                        "bold",
                        "italic",
                        "link",
                        "bulleted-list",
                        "numbered-list",
                      ]
                    editor_components: []
                  - label: "Links"
                    name: "links"
                    widget: "list"
                    required: false
                    min: 0
                    max: 2
                    fields:
                      - label: "Link URL"
                        name: "url"
                        widget: "string"
                      - label: "Link Text"
                        name: "text"
                        widget: "string"
                      - label: "Target"
                        name: "target"
                        widget: "select"
                        options:
                          - { label: "Same Tab", value: "_self" }
                          - { label: "New Tab", value: "_blank" }
                        required: false
                      - label: "Button Color"
                        name: "button_color"
                        widget: "select"
                        options:
                          - { label: "Primary", value: "primary" }
                          - { label: "Secondary", value: "secondary" }
                        required: false

              - label: "Rich Text Section"
                name: "rich_text"
                widget: "object"
                fields:
                  - label: "Text Alignment"
                    name: "text_align"
                    widget: "select"
                    default: "left"
                    options:
                      - { label: "Left", value: "left" }
                      - { label: "Center", value: "center" }
                      - { label: "Right", value: "right" }
                  - label: "Background Color"
                    name: "bg_color"
                    widget: "select"
                    default: "white"
                    options:
                      - { label: "White", value: "white" }
                      - { label: "Light Gray", value: "light-gray" }
                      - { label: "Dark Green", value: "green" }
                      - { label: "Amber", value: "amber" }
                  - label: "Content"
                    name: "body"
                    widget: "markdown"
              - label: "Multi-Text Grid Section"
                name: "multi_text_grid"
                widget: "object"
                fields:
                  - label: "Section Heading"
                    name: "section_heading"
                    widget: "string"
                    required: false
                  - label: "Background Color"
                    name: "bg_color"
                    widget: "select"
                    default: "white"
                    options:
                      - { label: "White", value: "white" }
                      - { label: "Light Gray", value: "light-gray" }
                      - { label: "Dark Green", value: "green" }
                      - { label: "Amber", value: "amber" }
                  - label: "Text Sections"
                    name: "text_sections"
                    widget: "list"
                    required: true
                    fields:
                      - label: "Heading (Optional)"
                        name: "heading"
                        widget: "string"
                        required: false
                      - label: "Content"
                        name: "body"
                        widget: "markdown"
              - label: "Image Card Grid Section"
                name: "image_card_grid"
                widget: "object"
                fields:
                  - label: "Section Heading"
                    name: "section_heading"
                    widget: "string"
                    required: false
                  - label: "Cards"
                    name: "cards"
                    widget: "list"
                    required: true
                    fields:
                      - label: "Heading"
                        name: "heading"
                        widget: "string"
                        required: false
                      - label: "Card Image"
                        name: "image"
                        widget: "image"
                        required: false
                      - label: "Image Alt Text"
                        name: "image_alt"
                        widget: "string"
                        required: false
                      - label: "Content"
                        name: "body"
                        widget: "markdown"
                        required: false
                      - label: "Card Link URL"
                        name: "card_url"
                        widget: "string"
                        required: false
                        hint: "URL for the entire card (including title, image, body, and button)"
                      - label: "CTA Button Text"
                        name: "cta_text"
                        widget: "string"
                        required: false
                        hint: "Text for the button at the bottom (e.g. Learn More)"
              - label: "Image & Content Box"
                name: "media_box"
                widget: "object"
                fields:
                  - { label: "Image", name: "image", widget: "image" }
                  - {
                      label: "Image Alt Text",
                      name: "image_alt",
                      widget: "string",
                      required: false,
                      hint: "Describe the image for screen readers and SEO",
                    }
                  - {
                      label: "Image Position",
                      name: "image_position",
                      widget: "select",
                      options: ["left", "right"],
                      default: "left",
                    }
                  - {
                      label: "Background Color",
                      name: "background_color",
                      widget: "select",
                      options:
                        [
                          { label: "White", value: "white" },
                          { label: "Light Grey", value: "light-grey" },
                          { label: "Amber", value: "amber" },
                          { label: "Dark Green", value: "dark-green" },
                        ],
                      default: "white",
                    }
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Content", name: "content", widget: "markdown" }
                  - {
                      label: "Button Text",
                      name: "button_text",
                      widget: "string",
                      required: false,
                    }
                  - {
                      label: "Button URL",
                      name: "button_url",
                      widget: "string",
                      required: false,
                    }
                  - {
                      label: "Button Style",
                      name: "button_style",
                      widget: "select",
                      options:
                        [
                          { label: "Primary", value: "primary" },
                          { label: "Secondary", value: "secondary" },
                          { label: "Tertiary", value: "tertiary" },
                        ],
                      default: "primary",
                      required: false,
                    }
      - label: "Our Story"
        name: "about"
        file: "content/story.md"
        # Anchor definition for modular standard internal pages
        fields: &standard_modular_fields
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Include in Main Menu?"
            name: "tags"
            widget: "select"
            options:
              - { label: "No", value: "" }
              - { label: "Yes", value: "nav" }
            default: "nav"
            multiple: false
            required: false
          - label: "Main Menu Order"
            name: "navOrder"
            widget: "number"
            default: 2
          - label: "Layout"
            name: "layout"
            widget: "hidden"
            default: "layout.njk"
          - label: "Permalink"
            name: "permalink"
            widget: "hidden"
            default: "/{{slug}}/"
          # Reuse the modular section block anchor
          - *blocks_field

      - label: "Media"
        name: "media"
        file: "content/media.md"
        fields: *standard_modular_fields

      - label: "Services"
        name: "services"
        file: "content/services.md"
        fields: *standard_modular_fields

      - label: "Donate"
        name: "donate"
        file: "content/donate.md"
        fields: *standard_modular_fields

      - label: "Volunteer"
        name: "volunteer"
        file: "content/volunteer.md"
        fields: *standard_modular_fields
  - name: "events"
    label: "Events"
    folder: "content/events" # Path where event markdown files will be saved
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Start Date & Time",
          name: "event_date",
          widget: "datetime",
          format: "YYYY-MM-DD HH:mm",
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
        }
      - {
          label: "End Date & Time",
          name: "event_end_date",
          widget: "datetime",
          format: "YYYY-MM-DD HH:mm",
          date_format: "YYYY-MM-DD",
          time_format: "HH:mm",
          required: false,
        }
      - {
          label: "Location",
          name: "location",
          widget: "string",
          required: false,
        }
      - { label: "Summary", name: "summary", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
